<ion-content class="safe-area">

  <!-- Empty Cart View with Animation -->
  <div *ngIf="cartItems.length === 0 || totalPrice === 0" class="empty-cart">
<!-- cart.page.html -->
<div *ngIf="cartItems.length === 0" class="empty-cart">
  <div class="lottie-embed-container">
    <iframe src="https://lottie.host/embed/942fa922-eda0-439b-9665-e9849c73da41/kg3DkKtlw3.lottie" frameborder="0" width="300" height="500"></iframe>
  </div>
  <p class="empty-message">Your cart is empty!</p>
</div>


  </div>

  <!-- Cart Items View with Animation -->
  <div class="cart-container" *ngIf="cartItems.length > 0 && totalPrice > 0" @fadeInOut>
    
    <!-- Cart Items List -->
    <div class="cart-list">
      <div class="cart-item" *ngFor="let history of cartItems">
        <img [src]="history.image" alt="{{ history.name }}" class="cart-image" />
        <div class="cart-details">
          <h4>{{ history.name }}</h4>
          <p class="price">${{ history.price }}</p>
        </div>
        <ion-button fill="clear" color="danger" (click)="removeFromCart(history.id)">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- Summary Section -->
    <div class="summary-card">
      <div class="summary-row">
        <span>Total (Subtotal)</span>
        <span class="price">${{ totalPrice.toFixed(2) }}</span>
      </div>

      <ion-button expand="block" color="dark" [routerLink]="['/stripe-payment', userId, totalPrice]">
        Pay with Stripe
      </ion-button>
      <ion-button expand="block" color="warning" fill="outline">
        Pay with PayPal
      </ion-button>
    </div>
    
  </div>
</ion-content>
