<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>paypal-payment</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">paypal-payment</ion-title>
    </ion-toolbar>
  </ion-header>

  <button (click)="payWithPaypal()">
    <img src="https://www.paypalobjects.com/webstatic/en_US/i/buttons/checkout-logo-large.png" 
         alt="Pay with PayPal" style="width: 200px; height: auto;">
  </button>
  
</ion-content>
