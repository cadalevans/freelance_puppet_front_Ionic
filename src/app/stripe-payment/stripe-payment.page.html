<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Payment Page</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding payment-page">
  <div class="payment-container">
    <ion-card class="payment-card">
      <ion-card-header>
        <ion-card-title class="payment-title">Confirm your Payment</ion-card-title>
        <ion-card-subtitle class="payment-subtitle">
          Please review your payment details before proceeding.
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div class="payment-details">
          <div class="price-info">
            <span class="label">Total Amount:</span>
            <span class="amount">{{ totalPrice | currency: 'USD' }}</span>
          </div>

        </div>

        <div class="payment-actions">
         <!-- <ion-button 
            expand="full" 
            color="danger"
            (click)="payNow()"
            class="pay-now-btn"
          >
            💳 Pay Now
          </ion-button>
          -->

          <ion-button 
            expand="full" 
            color="medium"
            (click)="goBack()"
            class="cancel-btn"
          >
            ❌ Cancel Payment
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
