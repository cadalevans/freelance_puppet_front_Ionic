<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Stripe Payment</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Confirm your Payment</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>You are about to pay:</p>
      <h2><strong>$ {{ totalPrice.toFixed(2) }}</strong></h2>

      <ion-button 
        expand="full" 
        color="success"
        (click)="payNow()"
      >
        💳 Pay Now with Stripe
      </ion-button>

      <ion-button 
        expand="full" 
        color="medium"
        (click)="goBack()"
      >
        ❌ Cancel Payment
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
