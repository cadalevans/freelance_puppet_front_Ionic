<ion-header class="custom-header">
  <ion-toolbar class="search-toolbar"></ion-toolbar>

  <ion-toolbar>
    <div class="logo-container" slot="start">
      <img src="assets/logo-removebg.png" alt="Logo" class="background-logo" />
    </div>

    <ion-searchbar
      *ngIf="showSearch"
      placeholder="Search story"
      class="custom-searchbar"
      (ionInput)="search.emit($event)">
    </ion-searchbar>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [value]="currentSegment" (ionChange)="onSegmentChange($event.detail.value)">
      <ion-segment-button value="all">
        <ion-label>All</ion-label>
      </ion-segment-button>
      <ion-segment-button value="favorites">
        <ion-label>Favorites</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>
