<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
    </ion-buttons>
    <ion-title></ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-buttons slot="start">
      
    </ion-buttons>
    <ion-title color="danger"><strong>My Story</strong></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" class="safe-area">
  <!-- Search Bar -->
  <ion-searchbar animated="true" show-clear-button="focus" value="Show on Focus" (ionInput)="filterItems($event)"></ion-searchbar>

  <div class="history-list">
    <div class="history-item" *ngFor="let history of filteredHistories"  (click)="goToHistoryDetail(history.id)">
      <div class="history-card">
        <img class="history-image" [src]="history.image" alt="{{ history.name }}" />
        
        <div class="history-text">
          <h4><strong> {{ history.name }} </strong></h4>
          <p class="price">${{ history.price }}</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
