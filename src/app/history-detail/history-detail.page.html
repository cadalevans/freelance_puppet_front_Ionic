
<ion-card color="light">
  <img [src]="history?.image"/>
  <ion-card-content>
    <ion-card-title>
     <strong> {{ history?.name }} </strong>
      </ion-card-title>
      <hr>
    <p>
      {{ history?.description }}
    </p>
    <hr>
    <p><strong>Price:</strong> ${{ history?.price }}</p>
   <!-- <hr>
    <strong>Categories:</strong> <p>{{ getCategoryNames() }}</p>
    -->
    <hr>
    <strong>Categories:</strong>
    <div *ngFor="let category of history?.categoryName" 
     class="category-badge"
     [ngStyle]="{'background-color': getRandomColor()}">
      {{ category.name }}
    </div>
  </ion-card-content>
</ion-card>
