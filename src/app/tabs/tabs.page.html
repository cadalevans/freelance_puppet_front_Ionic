<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <!-- Store Tab -->
    <ion-tab-button [routerLink]="['/tabs/home']" [class.active-tab]="isActive(['/tabs/home', '/tabs/by-category'])">
      <svg class="custom-tab-icon"  [attr.fill]="isActive(['/tabs/home', '/tabs/by-category']) ? '#ffcc66' : 'none'"  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="1"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-building-store"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 21l18 0" /><path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" /><path d="M5 21l0 -10.15" /><path d="M19 21l0 -10.15" /><path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" /></svg>
      <ion-label [class.active-label]="isActive(['/tabs/home', '/tabs/by-category'])">Store</ion-label>
    </ion-tab-button>

    <!-- Library Tab -->
    <ion-tab-button [routerLink]="['/tabs/mystory']" [class.active-tab]="isActive('/tabs/mystory')">
      <svg  class="custom-tab-icon"  [attr.fill]="isActive('/tabs/mystory') ? '#ffcc66' : 'none'"  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="1"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-books"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 4m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" /><path d="M9 4m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" /><path d="M5 8h4" /><path d="M9 16h4" /><path d="M13.803 4.56l2.184 -.53c.562 -.135 1.133 .19 1.282 .732l3.695 13.418a1.02 1.02 0 0 1 -.634 1.219l-.133 .041l-2.184 .53c-.562 .135 -1.133 -.19 -1.282 -.732l-3.695 -13.418a1.02 1.02 0 0 1 .634 -1.219l.133 -.041z" /><path d="M14 9l4 -1" /><path d="M16 16l3.923 -.98" /></svg>
      <ion-label [class.active-label]="isActive('/tabs/mystory')">Library</ion-label>
    </ion-tab-button>

    <!-- Cart Tab -->
    <ion-tab-button [routerLink]="['/tabs/cart']" [class.active-tab]="isActive('/tabs/cart')">
      <svg class="custom-tab-icon"  [attr.fill]="isActive('/tabs/cart') ? '#ffcc66' : 'none'" xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="1"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 17h-11v-14h-2" /><path d="M6 5l14 1l-1 7h-13" /></svg>
      <ion-badge *ngIf="cartCount > 0" color="danger">{{ cartCount }}</ion-badge>
      <ion-label [class.active-label]="isActive('/tabs/cart')">Cart</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
